; Limites d'envoi de fichiers pour l'administration (photos d'équipes, logos, images de services).
; Les valeurs par défaut de l'hébergement (2M / 8M) rejettent les photos de téléphone.
; Fichier lu par PHP-FPM / CGI ; relu toutes les 5 minutes (user_ini.cache_ttl).
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120
